[project]
name = "catte-music"
version = "0.1.0"
description = "AI 音乐情绪可视化与探索平台 - FastAPI 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    # cryptography>=43 在 Intel macOS 仅 pypy/arm64 wheel，固定到仍有 abi3 x86_64 wheel 的 42.x
    "cryptography>=42.0.0,<43",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 与 bcrypt 5.x 不兼容（detect_wrap_bug 触发 ValueError），固定到 4.x
    "bcrypt>=4.0.0,<5",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "pycryptodome>=3.20.0",
    "librosa>=0.10.0",
    # Intel macOS 上 llvmlite>=0.44 / numba>=0.61 无预编译 wheel，需固定到仍提供 x86_64 wheel 的版本
    "numba>=0.60,<0.61",
    "llvmlite>=0.43,<0.44",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
