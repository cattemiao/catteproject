services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catte
      POSTGRES_PASSWORD: catte_pass
      POSTGRES_DB: catte
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catte"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://catte:catte_pass@db:5432/catte
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  pg_data:
